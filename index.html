
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wikipedia Search Application</title>

    <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="main-container">
        <div class="wiki-search-header text-center">
            <img
                class="wiki-logo"
                src="https://d2clawv67efefq.cloudfront.net/ccbp-dynamic-webapps/wiki-logo-img.png"
                alt="Wikipedia Logo"
            />

            <input
                id="searchInput"
                placeholder="Type a keyword and press Enter to search"
                type="search"
                class="search-input"
            />
        </div>

        <div class="d-none" id="spinner">
            <div class="d-flex justify-content-center">
                <div class="spinner-border" role="status"></div>
            </div>
        </div>

        <div class="search-results" id="searchResults"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
